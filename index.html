<div class="note"><h2>Founder's Note</h2><p class="q">Every artist deserves a stage. Every stage deserves great artists.</p>

<div class="pill"><b>Visibility that is earned, not bought.</b> Verified artists with an active plan get good visibility on the platform, so talent gets noticed for the quality of the work.</div>
<h3>How Art 27 sustains itself</h3>
